# Builds ADO Desk for macOS (Apple Silicon, Intel) and Windows (x64).
# - Manual run (workflow_dispatch): build only; installers are kept as run artifacts.
# - Tag push (v*): build, then create a draft GitHub release with every installer.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            installers: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            installers: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            installers: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ado-desk-${{ matrix.name }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version}." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" installers/* \
            --draft \
            --verify-tag \
            --title "ADO Desk ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
